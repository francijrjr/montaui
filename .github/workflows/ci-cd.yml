name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: git diff --exit-code
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/montaui-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
        env:
          MONTA_TEST_URL: http://127.0.0.1:4173
      - run: npm pack --dry-run

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Deploy to Vercel
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo '::error::Configure VERCEL_DEPLOY_HOOK_URL for the main branch in repository secrets.'
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" > /dev/null
